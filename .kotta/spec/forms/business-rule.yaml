id: business-rule
version: 1
directory: business-rules
canonical_source: Ross
description: A durable constraint or derivation that the business expects behavior to obey.
identity:
  prefix: BR
  format: "<prefix>-<26-character lowercase Crockford ULID>"
  filename: "<slug>-<last 8 id characters>.md"
required_fields:
  frontmatter: [id, form, title]
  body_headings: [Rule, Rationale, Scope]
normative_sections: [Rule]  # one of these states the obligation with SHALL or MUST
# A requirement that holds for the whole product carries `overall: true`.
field_values:
  overall: [true, false]
required_edges:
  - name: evidence
    direction: incoming
    fields: [subjects]
    source_forms: [example]
    target_forms: [business-rule]
    minimum: 1
    question: What would break if this rule were violated?
  # Every requirement has a place (BR-01m4ee23pwf0sg22vta05bc2hz): a use case refines it, or it is
  # overall (BR-01m4ee23baq19gd87ez4m9zxdw). A warning on an accepted node, an error on a change's.
  - name: placement
    direction: incoming
    fields: [refines]
    source_forms: [use-case]
    target_forms: [business-rule]
    minimum: 1
    waived_by: overall
    on_accepted: warning
    question: Which use case relies on this rule, or does it hold for the whole product (overall)?
recognition_signals:
  - The conversation uses must, may only, never, always, eligible, or calculated as.
  - A policy remains true across more than one interaction.
  - An exception, threshold, classification, or derivation controls behavior.
